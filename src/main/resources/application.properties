# ===========================================================================
#  Spring / Server
# ===========================================================================
spring.application.name=fitness-litrpg
# Heroku injects $PORT at runtime; fall back to 8080 for local development.
server.port=${PORT:8080}

# ===========================================================================
#  JPA / Hibernate
# ===========================================================================
# Schema is owned by src/main/resources/schema.sql (CREATE TABLE IF NOT EXISTS),
# so Hibernate must NOT try to generate or drop tables.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Hibernate SQL logging (requirement #2) -------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===========================================================================
#  Raw DDL initialization (requirement #1)
#  Runs schema.sql on every startup. Because every statement uses
#  "IF NOT EXISTS", it is idempotent and behaves like a lightweight migration.
# ===========================================================================
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.continue-on-error=false

# ===========================================================================
#  Datasource (LOCAL DEV FALLBACK ONLY)
#  In production the DataSourceConfig bean parses Heroku's DATABASE_URL and
#  these values are ignored. They exist so the app boots locally out of the box.
# ===========================================================================
#spring.datasource.url=jdbc:postgresql://192.168.1.239:5432/fitrpg_db
spring.datasource.url=jdbc:postgresql://localhost:5432/fitrpg_db
spring.datasource.username=fitrpg_app
spring.datasource.password=healthIsWealth!
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================================================
#  CORS (consumed by WebConfig)
#  Empty by default: the app serves its own frontend, so normal usage is
#  same-origin and never needs CORS headers at all. Only set
#  APP_CORS_ALLOWED_ORIGINS (comma-separated) if a frontend hosted on a
#  *different* origin needs to call this API, e.g.
#  https://your-frontend.example.com
# ===========================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ===========================================================================
#  Player JWT auth
#  No insecure default: JWT_SECRET must be set in the environment (a random
#  string >= 32 bytes) or the app refuses to start. Generate one with:
#    openssl rand -base64 48
# ===========================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===========================================================================
#  Activity sync (wearable-integration groundwork)
#  Steps above the threshold convert to CON XP; active minutes above the
#  threshold convert to STR XP, both routed through the normal reward
#  pipeline (streak + event multipliers, bonus-challenge roll).
# ===========================================================================
app.activity-sync.step-threshold=${ACTIVITY_SYNC_STEP_THRESHOLD:5000}
app.activity-sync.steps-per-xp-unit=${ACTIVITY_SYNC_STEPS_PER_XP_UNIT:1000}
app.activity-sync.minutes-threshold=${ACTIVITY_SYNC_MINUTES_THRESHOLD:20}
app.activity-sync.minutes-per-xp-unit=${ACTIVITY_SYNC_MINUTES_PER_XP_UNIT:10}
app.activity-sync.xp-per-unit=${ACTIVITY_SYNC_XP_PER_UNIT:15}
